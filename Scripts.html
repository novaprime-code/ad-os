<script>
const App = (function(){
  'use strict';

  // ── State ──────────────────────────────────────────────
  const S = { ready:false, user:'there', settings:{}, counts:{}, stats:{xp:0,level:0},
              domains:[], weights:{}, cache:{} };

  // ── API client (one round-trip → Result envelope) ──────
  function gas(action, payload){
    return new Promise((resolve,reject)=>{
      if(!(window.google && google.script && google.script.run))
        return reject(new Error('Not running inside the LifeOS web app'));
      google.script.run
        .withSuccessHandler(r => (r && r.ok) ? resolve(r.data) : reject(new Error((r&&r.error&&r.error.message)||'Request failed')))
        .withFailureHandler(e => reject(e))
        .api(action, payload||{});
    });
  }

  // ── Helpers ────────────────────────────────────────────
  const $ = s => document.querySelector(s);
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;}
  function domainColor(name){let h=0;for(let i=0;i<String(name).length;i++)h=(h*31+name.charCodeAt(i))%360;return `hsl(${h} 55% 62%)`;}
  function fmtDate(v){if(!v)return '';const d=new Date(v);if(isNaN(d))return '';return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
  function fmtTime(v){const d=new Date(v);if(isNaN(d))return '';return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});}
  const PRIO = {high:'hi',medium:'med',low:'lo'};

  // ── Toasts ─────────────────────────────────────────────
  function toast(msg,isErr){
    let wrap=$('.toast-wrap'); if(!wrap){wrap=document.createElement('div');wrap.className='toast-wrap';document.body.appendChild(wrap);}
    const t=document.createElement('div'); t.className='toast'+(isErr?' err':''); t.innerHTML=msg;
    wrap.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2800);
  }

  // ── Navigation config ──────────────────────────────────
  const NAV = [
    {id:'home',  label:'Home',     ico:'◆', primary:true},
    {id:'tasks', label:'Tasks',    ico:'✓', primary:true},
    {id:'inbox', label:'Inbox',    ico:'↓', primary:true, badge:()=>S.counts.inbox},
    {id:'ideas', label:'Ideas',    ico:'✦'},
    {id:'search',label:'Search',   ico:'⌕'},
    {id:'goals', label:'Goals',    ico:'◎'},
    {id:'habits',label:'Habits',   ico:'∿'},
    {id:'learning',label:'Learning',ico:'❡'},
    {id:'settings',label:'Settings',ico:'⚙'}
  ];
  const SOON = {applications:'Phase 7',health:'Phase 8',reviews:'Phase 5'};

  function route(){return (location.hash.replace('#/','')||'home');}
  function go(id){location.hash='#/'+id;}

  // ── Shell render ───────────────────────────────────────
  function renderShell(){
    const r=route();
    document.body.innerHTML = `
      <div class="shell">
        <header class="topbar">
          <div class="brand"><span class="dot"></span> LifeOS</div>
          <div class="capture-desktop">${captureFieldHTML()}</div>
          <div class="grow"></div>
          <button class="xp-pill" onclick="App.go('home')">⚡ <b>${S.stats.level}</b> · ${S.stats.xp} XP</button>
        </header>
        <div class="body">
          <aside class="sidebar">${NAV.map(n=>sideItem(n,r)).join('')}
            ${Object.keys(SOON).map(k=>`<button class="nav-item nav-soon"><span class="ico">○</span>${k[0].toUpperCase()+k.slice(1)}<span class="badge">soon</span></button>`).join('')}
          </aside>
          <main class="main" id="app"></main>
        </div>
        <nav class="bottomnav">
          ${bnItem('home','◆','Home',r)}
          ${bnItem('tasks','✓','Tasks',r)}
          <button class="bn-item" onclick="App.openCapture()"><div class="fab">+</div></button>
          ${bnItem('inbox','↓','Inbox',r,S.counts.inbox)}
          ${bnItem('more','≡','More',r)}
        </nav>
      </div>
      <div class="scrim" id="scrim" onclick="App.closeCapture()"></div>
      <div class="sheet" id="sheet">
        <div class="grip"></div><h3>Quick capture</h3>
        <textarea id="capText" placeholder="Type anything — a task, idea, note, event…"></textarea>
        <div class="sheet-row">
          <button class="btn ghost" onclick="App.closeCapture()">Cancel</button>
          <button class="btn primary block" onclick="App.submitCapture('capText')">Capture</button>
        </div>
      </div>`;
    renderView();
  }
  function sideItem(n,r){const b=n.badge&&n.badge();return `<button class="nav-item ${n.id===r?'active':''}" onclick="App.go('${n.id}')"><span class="ico">${n.ico}</span>${n.label}${b?`<span class="badge">${b}</span>`:''}</button>`;}
  function bnItem(id,ico,label,r,badge){return `<button class="bn-item ${id===r?'active':''}" onclick="App.go('${id}')"><span class="ico">${ico}</span>${label}${badge?`<span class="badge">${badge}</span>`:''}</button>`;}
  function captureFieldHTML(){return `<div class="capture-field"><input id="capTop" placeholder="Quick capture…" onkeydown="if(event.key==='Enter')App.submitCapture('capTop')"><button class="send" onclick="App.submitCapture('capTop')">↑</button></div>`;}

  // ── View router ────────────────────────────────────────
  function renderView(){
    const r=route(), app=$('#app'); if(!app)return;
    app.innerHTML = skeleton();
    const V = VIEWS[r] || VIEWS.more;
    Promise.resolve().then(()=>V(app)).catch(e=>{app.innerHTML=errorState(e.message);});
  }
  function skeleton(){return `<div class="page-head"><div><div class="skel" style="width:130px;height:24px"></div></div></div>
     ${[0,1,2].map(()=>`<div class="card" style="margin-bottom:12px"><div class="skel" style="width:70%;height:16px;margin-bottom:10px"></div><div class="skel" style="width:40%;height:12px"></div></div>`).join('')}`;}
  function errorState(m){return `<div class="empty"><span class="em">⚠️</span>Couldn’t load this view<div class="hint">${esc(m)}</div></div>`;}
  function emptyState(em,title,hint){return `<div class="empty"><span class="em">${em}</span>${title}${hint?`<div class="hint">${hint}</div>`:''}</div>`;}

  // ── Reusable item renderers ────────────────────────────
  function taskItem(t){
    const dom=t.Domain||'personal';
    return `<div class="item" data-id="${t.ID}">
      <button class="check" onclick="App.complete('${t.ID}')" aria-label="Complete"></button>
      <div class="body">
        <div class="title">${esc(t.Title)}</div>
        <div class="meta">
          <span class="chip ${PRIO[t.Priority]||''}"><span class="dot" style="background:currentColor"></span>${t.Priority||'—'}</span>
          <span class="chip"><span class="dot" style="background:${domainColor(dom)}"></span>${esc(dom)}</span>
          ${t.DueDate?`<span>⏳ ${fmtDate(t.DueDate)}</span>`:''}
          <span class="id mono">${t.ID}</span>
        </div>
      </div></div>`;
  }

  // ── Views ──────────────────────────────────────────────
  const VIEWS = {
    async home(app){
      const [today,events] = await Promise.all([ gas('tasks.list',{filter:'today'}), gas('events.today').catch(()=>[]) ]);
      const top = today.slice(0,5);
      const byDomain={}; today.forEach(t=>{const d=t.Domain||'personal';byDomain[d]=(byDomain[d]||0)+1;});
      app.innerHTML = `
        <div class="page-head"><div><h1>Hi, ${esc(S.user)}</h1><div class="sub">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div></div></div>
        <div class="grid cols-2" style="margin-bottom:12px">
          <div class="card stat"><span class="n">${S.counts.openTasks||0}</span><span class="l">Open tasks</span></div>
          <div class="card stat"><span class="n">${S.counts.inbox||0}</span><span class="l">Inbox</span></div>
        </div>
        ${events.length?`<div class="card" style="margin-bottom:12px"><div class="set-group"><h2 style="margin:0 0 10px">Today’s schedule</h2></div>${events.map(e=>`<div class="item"><div class="body"><div class="title">${esc(e.title)}</div><div class="meta">🕘 ${fmtTime(e.start)}–${fmtTime(e.end)}</div></div></div>`).join('')}</div>`:''}
        <div class="card">
          <div class="page-head" style="margin:0 0 6px"><div><h1 style="font-size:18px">Top focus</h1><div class="sub">${top.length} of ${today.length} for today</div></div></div>
          ${top.length?top.map(taskItem).join(''):emptyState('🎯','Nothing due today','Capture something with the + button')}
        </div>
        ${Object.keys(byDomain).length?`<div class="card"><div class="set-group"><h2 style="margin:0 0 12px">By domain</h2></div>${Object.entries(byDomain).sort((a,b)=>b[1]-a[1]).map(([d,n])=>`<div class="item" style="padding:8px 0"><span class="chip"><span class="dot" style="background:${domainColor(d)}"></span>${esc(d)}</span><div class="grow"></div><span class="mono" style="color:var(--muted)">${n}</span></div>`).join('')}</div>`:''}
      `;
    },

    async tasks(app){
      const f = S._taskFilter || 'today';
      const filters=['today','all','high','overdue','waiting'];
      const list = await gas('tasks.list',{filter:f});
      app.innerHTML = `
        <div class="page-head"><div><h1>Tasks</h1><div class="sub">${list.length} ${f}</div></div></div>
        <div class="seg" style="margin-bottom:14px">${filters.map(x=>`<button class="${x===f?'on':''}" onclick="App.setTaskFilter('${x}')">${x}</button>`).join('')}</div>
        <div class="card">${list.length?list.map(taskItem).join(''):emptyState('✓','No '+f+' tasks',f==='today'?'Add one with the + button':'')}</div>`;
    },

    async inbox(app){
      const items = await gas('inbox.list',{});
      app.innerHTML = `
        <div class="page-head"><div><h1>Inbox</h1><div class="sub">${items.length} to triage</div></div></div>
        <div class="card">${items.length?items.map(i=>`
          <div class="item" data-id="${i.ID}">
            <div class="body"><div class="title">${esc(i.AI_Summary||i.RawContent)}</div>
              <div class="meta"><span class="chip">${esc(i.Category||'note')}</span><span class="id mono">${i.ID}</span></div>
              <div class="sheet-row" style="margin-top:10px">
                <button class="btn sm" onclick="App.triage('${i.ID}','task')">📝 Task</button>
                <button class="btn sm" onclick="App.triage('${i.ID}','idea')">💡 Idea</button>
                <button class="btn sm ghost" onclick="App.triage('${i.ID}','trash')">🗑</button>
              </div></div>
          </div>`).join(''):emptyState('🎉','Inbox zero','Everything’s been processed')}</div>`;
    },

    async ideas(app){
      const list = await gas('ideas.list',{});
      app.innerHTML = `
        <div class="page-head"><div><h1>Ideas</h1><div class="sub">${list.length} saved</div></div></div>
        <div class="card">${list.length?list.map(i=>`<div class="item"><div class="body"><div class="title">${esc(i.AI_Summary||i.RawContent)}</div><div class="meta"><span class="chip"><span class="dot" style="background:${domainColor(i.Domain||'personal')}"></span>${esc(i.Domain||'personal')}</span><span class="chip">${esc(i.Category||'other')}</span><span class="id mono">${i.ID}</span></div></div></div>`).join(''):emptyState('✦','No ideas yet','Capture one with the + button')}</div>`;
    },

    async search(app){
      app.innerHTML = `<div class="page-head"><div><h1>Search</h1></div></div>
        <div class="capture-field" style="margin-bottom:16px"><input id="q" placeholder="Search tasks, ideas, notes…" onkeydown="if(event.key==='Enter')App.doSearch()"><button class="send" onclick="App.doSearch()">⌕</button></div>
        <div id="results"></div>`;
      setTimeout(()=>$('#q')&&$('#q').focus(),60);
    },

    async goals(app){
      const list = await gas('goals.list',{}).catch(()=>[]);
      app.innerHTML = `<div class="page-head"><div><h1>Goals</h1><div class="sub">${list.length} active</div></div></div>
        <div class="card">${list.length?list.map(g=>{const p=Math.round((+g.Progress||0)*(String(g.Progress).includes('.')?100:1));return `<div class="item"><div class="body"><div class="title">${esc(g.Title)}</div><div class="meta"><span class="chip"><span class="dot" style="background:${domainColor(g.Domain||'personal')}"></span>${esc(g.Domain||'personal')}</span>${g.Deadline?`<span>⏳ ${fmtDate(g.Deadline)}</span>`:''}</div><div style="height:7px;background:var(--surface-2);border-radius:6px;margin-top:9px;overflow:hidden"><div style="height:100%;width:${Math.min(p,100)}%;background:var(--accent)"></div></div></div></div>`;}).join(''):emptyState('◎','No goals yet','Goal editing arrives with the next pass')}</div>`;
    },

    async habits(app){
      const list = await gas('habits.list',{}).catch(()=>[]);
      app.innerHTML = `<div class="page-head"><div><h1>Habits</h1><div class="sub">${list.length} tracked</div></div></div>
        <div class="card">${list.length?list.map(h=>`<div class="item"><div class="body"><div class="title">${esc(h.Name)}</div><div class="meta"><span class="chip">${esc(h.Frequency||'daily')}</span><span>🔥 ${h.Streak||0} streak</span></div></div></div>`).join(''):emptyState('∿','No habits yet','Check-off + streaks land in a later pass')}</div>`;
    },

    async learning(app){
      const list = await gas('learning.list',{}).catch(()=>[]);
      app.innerHTML = `<div class="page-head"><div><h1>Learning</h1><div class="sub">${list.length} notes</div></div></div>
        <div class="card">${list.length?list.map(l=>`<div class="item"><div class="body"><div class="title">${esc(trunc(l.Content,160))}</div><div class="meta"><span class="chip">${esc(l.Topic||'general')}</span></div></div></div>`).join(''):emptyState('❡','No notes yet','German vocab deck arrives in Phase 6')}</div>`;
    },

    async settings(app){ await renderSettings(app); },

    async more(app){
      const tiles = NAV.filter(n=>!n.primary).concat(Object.keys(SOON).map(k=>({id:k,label:k[0].toUpperCase()+k.slice(1),ico:'○',soon:SOON[k]})));
      app.innerHTML = `<div class="page-head"><div><h1>More</h1></div></div>
        <div class="grid cols-2">${tiles.map(t=>`<button class="card" style="text-align:left;${t.soon?'opacity:.55':''}" onclick="${t.soon?'':`App.go('${t.id}')`}"><div style="font-size:22px;margin-bottom:8px">${t.ico}</div><div style="font-weight:600">${t.label}</div>${t.soon?`<div class="hint">${t.soon}</div>`:''}</button>`).join('')}</div>`;
    }
  };

  // ── Settings view ──────────────────────────────────────
  const SET_GROUPS = [
    ['Identity',['USER_NAME','LANGUAGE','TIMEZONE']],
    ['AI provider',['AI_PROVIDER','AI_BASE_URL','AI_API_KEY','AI_MODEL']],
    ['AI fallback',['AI_FALLBACK_PROVIDER','AI_FALLBACK_BASE_URL','AI_FALLBACK_API_KEY','AI_FALLBACK_MODEL']],
    ['Voice & vision',['VOICE_MODEL','VOICE_API_KEY','VISION_MODEL','VISION_API_KEY']],
    ['Messaging',['MSG_PROVIDER','TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_ID']],
    ['Domains',['DOMAINS','DEFAULT_DOMAIN','DOMAIN_WEIGHTS']],
    ['Automation',['N8N_ENABLED','N8N_WEBHOOK_URL','GAMIFICATION_ENABLED','AI_CATEGORIZE']]
  ];
  async function renderSettings(app){
    const s = await gas('settings.get',{}); S._set=s;
    app.innerHTML = `<div class="page-head"><div><h1>Settings</h1><div class="sub">Changes apply immediately</div></div></div>
      ${SET_GROUPS.map(([g,keys])=>`<div class="set-group"><h2>${g}</h2>${keys.filter(k=>s[k]).map(k=>fieldHTML(k,s[k])).join('')}</div>`).join('')}
      <div class="card"><h2 class="set-group" style="margin-top:0">Connections</h2>
        <div class="sheet-row" style="flex-wrap:wrap"><button class="btn sm" onclick="App.test('ai')">Test AI</button>
        <button class="btn sm" onclick="App.test('messaging')">Test messaging</button>
        <button class="btn sm" onclick="App.setWebhook()">Set webhook</button></div></div>
      <button class="btn primary block" style="margin-top:16px" onclick="App.saveSettings()">Save changes</button>`;
  }
  function fieldHTML(k,o){
    const friendly=k.replace(/_/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
    if(o.secret) return `<div class="field"><label>${friendly}</label><div class="desc">${esc(o.description||'')}</div><input data-k="${k}" data-secret="1" type="password" placeholder="${o.value?'•••• saved — leave blank to keep':'not set'}"></div>`;
    return `<div class="field"><label>${friendly}</label><div class="desc">${esc(o.description||'')}</div><input data-k="${k}" value="${esc(o.value)}"></div>`;
  }

  // ── Actions ────────────────────────────────────────────
  function setTaskFilter(f){S._taskFilter=f;renderView();}
  function doSearch(){
    const q=$('#q').value.trim(); if(!q)return; const box=$('#results'); box.innerHTML=skeleton();
    gas('search.global',{query:q}).then(rs=>{
      box.innerHTML = `<div class="card">${rs.length?rs.map(r=>`<div class="item"><div class="body"><div class="title">${r.icon} ${esc(r.text)}</div>${r.id?`<div class="meta"><span class="id mono">${r.id}</span></div>`:''}</div></div>`).join(''):emptyState('⌕','No results','Try a different word')}</div>`;
    }).catch(e=>box.innerHTML=errorState(e.message));
  }
  function complete(id){
    const el=document.querySelector(`.item[data-id="${id}"]`);
    if(el){el.classList.add('done');el.querySelector('.check').classList.add('done');el.querySelector('.check').innerHTML='✓';el.style.pointerEvents='none';}
    S.counts.openTasks=Math.max(0,(S.counts.openTasks||1)-1);
    gas('tasks.complete',{id}).then(d=>{ toast('✅ Done · <b style="color:var(--accent-2)">+XP</b>'); setTimeout(()=>{if(el)el.remove();},650); refreshBadges(); })
      .catch(e=>{ if(el){el.classList.remove('done');el.style.pointerEvents='';el.querySelector('.check').classList.remove('done');el.querySelector('.check').innerHTML='';} toast('Couldn’t complete: '+e.message,true); });
  }
  function triage(id,target){
    const el=document.querySelector(`.item[data-id="${id}"]`); if(el){el.style.opacity='.4';el.style.pointerEvents='none';}
    gas('inbox.triage',{id,target}).then(d=>{ toast(d.message||'Done'); if(el)el.remove(); S.counts.inbox=Math.max(0,(S.counts.inbox||1)-1); refreshBadges(); })
      .catch(e=>{ if(el){el.style.opacity='';el.style.pointerEvents='';} toast(e.message,true); });
  }
  function submitCapture(inputId){
    const inp=document.getElementById(inputId); const text=(inp.value||'').trim(); if(!text)return;
    inp.value=''; closeCapture(); toast('⏳ Capturing…');
    gas('inbox.process',{text,source:'spa'}).then(d=>{ toast(d.message||'Captured'); S.counts.inbox=(S.counts.inbox||0); bootstrapCounts(); if(['home','tasks','inbox','ideas'].includes(route()))renderView(); })
      .catch(e=>toast('Capture failed: '+e.message,true));
  }
  function test(target){ toast('⏳ Testing…'); gas('settings.test',{target}).then(d=>toast('✅ '+(d.message||'OK'))).catch(e=>toast('❌ '+e.message,true)); }
  function setWebhook(){ toast('⏳ Setting webhook…'); gas('system.setWebhook',{}).then(()=>toast('✅ Webhook set')).catch(e=>toast('❌ '+e.message,true)); }
  function saveSettings(){
    const patch={}; document.querySelectorAll('#app input[data-k]').forEach(inp=>{
      const k=inp.dataset.k, secret=inp.dataset.secret;
      if(secret){ if(inp.value.trim())patch[k]=inp.value.trim(); }
      else if(S._set[k] && inp.value!==S._set[k].value){ patch[k]=inp.value; }
    });
    if(!Object.keys(patch).length){toast('Nothing changed');return;}
    toast('⏳ Saving…');
    gas('settings.save',{settings:patch}).then(()=>{toast('✅ Saved '+Object.keys(patch).length+' setting(s)');init(true);}).catch(e=>toast('❌ '+e.message,true));
  }

  // ── Capture sheet ──────────────────────────────────────
  function openCapture(){$('#scrim').classList.add('show');$('#sheet').classList.add('show');setTimeout(()=>$('#capText')&&$('#capText').focus(),120);}
  function closeCapture(){$('#scrim').classList.remove('show');$('#sheet').classList.remove('show');}

  // ── Badges / counts ────────────────────────────────────
  function refreshBadges(){ document.querySelectorAll('.bn-item').forEach(()=>{}); renderShellBadges(); }
  function renderShellBadges(){ /* re-render nav badges cheaply */ const r=route();
    const bn=document.querySelector('.bottomnav'); if(bn){const inboxBtn=bn.children[3]; if(inboxBtn){const b=inboxBtn.querySelector('.badge'); if(S.counts.inbox){ if(b)b.textContent=S.counts.inbox; } else if(b) b.remove(); }}
  }
  function bootstrapCounts(){ gas('system.bootstrap',{}).then(d=>{S.counts=d.counts;S.stats=d.stats;renderShellBadges();const xp=document.querySelector('.xp-pill');if(xp)xp.innerHTML=`⚡ <b>${S.stats.level}</b> · ${S.stats.xp} XP`;}).catch(()=>{}); }

  // ── Init ───────────────────────────────────────────────
  function init(soft){
    return gas('system.bootstrap',{}).then(d=>{
      S.ready=true; S.user=d.user||'there'; S.settings=d.settings||{}; S.counts=d.counts||{}; S.stats=d.stats||{xp:0,level:0};
      S.domains=(d.settings.DOMAINS&&d.settings.DOMAINS.value||'personal').split(',').map(x=>x.trim()).filter(Boolean);
      if(!soft) renderShell(); else { renderShellBadges(); renderView(); }
    }).catch(e=>{ document.body.innerHTML=`<div class="empty" style="padding-top:80px"><span class="em">🔌</span>Couldn’t reach LifeOS<div class="hint">${esc(e.message)}</div><div class="hint" style="margin-top:14px">Open this from your deployed web-app URL, and run <span class="mono">setupLifeOS()</span> if you haven’t.</div></div>`; });
  }

  window.addEventListener('hashchange',()=>{ if(S.ready) renderShell(); });
  if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',()=>init(false));
  else init(false);

  return { go, openCapture, closeCapture, submitCapture, complete, triage, setTaskFilter, doSearch, test, setWebhook, saveSettings, init };
})();
</script>
