<style>
/* ─── Fonts ─────────────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

/* ─── Tokens ────────────────────────────────────────────── */
:root{
  --bg:#0f1117; --surface:#171a23; --surface-2:#1f2433; --raised:#232838;
  --border:#262a36; --border-soft:#20242f;
  --text:#e6e8ee; --muted:#8b90a0; --faint:#5b6072;
  --accent:#6366f1; --accent-2:#818cf8; --accent-soft:rgba(99,102,241,.16);
  --accent-glow:rgba(99,102,241,.35);
  --hi:#ff7a7a; --med:#f4c152; --lo:#6ee7a8;
  --r-card:16px; --r-ctl:11px; --r-pill:999px;
  --pad:16px; --gap:12px;
  --shadow:0 8px 28px rgba(0,0,0,.38);
  --bottom-nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:'Outfit',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:9px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── Shell ─────────────────────────────────────────────── */
.shell{min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px var(--pad);background:rgba(15,17,23,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent-glow)}
.topbar .grow{flex:1}
.xp-pill{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--border);border-radius:var(--r-pill);font-size:13px;background:var(--surface)}
.xp-pill b{color:var(--accent-2)}

.body{flex:1;display:flex;width:100%;max-width:1180px;margin:0 auto}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:var(--pad);padding-bottom:calc(var(--bottom-nav-h) + 78px)}

/* ─── Sidebar (desktop) ─────────────────────────────────── */
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;border-radius:var(--r-ctl);color:var(--muted);font-weight:500;font-size:14.5px;text-align:left}
.nav-item .ico{width:20px;text-align:center;font-size:16px}
.nav-item .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent-2);font-size:11.5px;font-weight:600;display:grid;place-items:center}
.nav-item:hover{color:var(--text);background:var(--surface)}
.nav-item.active{color:var(--text);background:var(--accent-soft)}
.nav-item.active .ico{color:var(--accent-2)}
.nav-soon{opacity:.45}

/* ─── Bottom nav + capture FAB (mobile) ─────────────────── */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--bottom-nav-h);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:rgba(23,26,35,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border)
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10.5px;font-weight:500;position:relative;height:100%;justify-content:center}
.bn-item .ico{font-size:19px}
.bn-item.active{color:var(--accent-2)}
.bn-item .badge{position:absolute;top:8px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-pill);background:var(--hi);color:#1a0d0d;font-size:10px;font-weight:700;display:grid;place-items:center}
.fab{
  display:grid;place-items:center;width:54px;height:54px;margin:-22px auto 0;border-radius:50%;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;font-size:26px;font-weight:300;
  box-shadow:0 8px 22px var(--accent-glow);
}
.fab:active{transform:scale(.94)}

/* ─── Capture ───────────────────────────────────────────── */
.capture-desktop{display:none}
.capture-field{
  display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);
}
.capture-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.capture-field input{flex:1;background:none;border:none;outline:none;color:var(--text)}
.capture-field .send{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}

/* mobile capture sheet */
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
  border-top-left-radius:22px;border-top-right-radius:22px;border-top:1px solid var(--border);
  padding:18px var(--pad) calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .22s cubic-bezier(.2,.7,.3,1)
}
.sheet.show{transform:translateY(0)}
.sheet h3{margin:2px 0 12px;font-size:16px}
.sheet textarea{width:100%;min-height:96px;resize:none;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-ctl);padding:12px;color:var(--text);outline:none}
.sheet textarea:focus{border-color:var(--accent)}
.sheet-row{display:flex;gap:10px;margin-top:12px}
.grip{width:38px;height:4px;border-radius:4px;background:var(--surface-2);margin:0 auto 14px}

/* ─── Components ────────────────────────────────────────── */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 16px}
.page-head h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.02em}
.page-head .sub{color:var(--muted);font-size:13.5px;margin-top:2px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--pad)}
.card + .card{margin-top:var(--gap)}
.grid{display:grid;gap:var(--gap)}
.grid.cols-2{grid-template-columns:1fr 1fr}

.stat{display:flex;flex-direction:column;gap:3px}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.02em;font-family:'JetBrains Mono',monospace}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:var(--r-ctl);background:var(--surface-2);color:var(--text);font-weight:600;font-size:14px;border:1px solid var(--border)}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:none;border-color:var(--border)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.block{width:100%}

.seg{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);overflow-x:auto;max-width:100%}
.seg button{padding:6px 13px;border-radius:var(--r-pill);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent-soft);color:var(--accent-2)}

.item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border-soft)}
.item:last-child{border-bottom:none}
.check{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);margin-top:1px;display:grid;place-items:center;transition:all .15s}
.check:hover{border-color:var(--accent-2)}
.check.done{background:var(--lo);border-color:var(--lo);color:#0c1a12}
.item .body{flex:1;min-width:0}
.item .title{font-weight:500;line-height:1.35;word-break:break-word}
.item .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.item.done .title{text-decoration:line-through;color:var(--faint)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.hi{color:var(--hi)} .chip.med{color:var(--med)} .chip.lo{color:var(--lo)}
.id{font-size:11px;color:var(--faint)}

.empty{text-align:center;padding:42px 18px;color:var(--muted)}
.empty .em{font-size:30px;display:block;margin-bottom:10px;opacity:.85}
.empty .hint{font-size:13px;color:var(--faint);margin-top:5px}

.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--bottom-nav-h) + 14px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{max-width:480px;width:100%;background:var(--raised);border:1px solid var(--border);border-radius:var(--r-ctl);padding:11px 14px;box-shadow:var(--shadow);font-size:14px;display:flex;gap:10px;align-items:center;animation:rise .2s ease}
.toast.err{border-color:rgba(255,122,122,.5)}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:var(--r-ctl)}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .desc{font-size:12px;color:var(--faint);margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-ctl);color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.set-group{margin-bottom:8px}
.set-group h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 12px}

/* ─── Desktop ───────────────────────────────────────────── */
@media (min-width:860px){
  .bottomnav{display:none}
  .main{padding:24px 28px;padding-bottom:40px}
  .body{padding:0 12px}
  .sidebar{display:flex;flex-direction:column;gap:3px;width:236px;flex:none;padding:18px 14px;position:sticky;top:61px;align-self:flex-start;height:calc(100vh - 61px)}
  .capture-desktop{display:block;flex:1;max-width:440px}
  .grid.cols-2{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1.4fr 1fr}
}
@media (max-width:859px){
  .topbar .capture-desktop{display:none}
  .sidebar{display:none}
}
</style>
